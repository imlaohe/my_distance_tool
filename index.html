<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F1F5F9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="丈量">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>丈量 · 三维测距</title>
    <script>
        // 提前应用已保存的配色，避免首屏闪烁
        (function () {
            try {
                var t = localStorage.getItem('rangingTheme_v1');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <style>
                :root {
            /* ===== 配色：户外强光（浅色，默认）===== */
            --bg: #F1F5F9;
            --surface: rgba(255, 255, 255, 0.92);
            --card-bg: rgba(255, 255, 255, 0.88);
            --border-rgb: 100, 116, 139;
            --border: rgba(var(--border-rgb), 0.25);
            --border-bright: rgba(var(--border-rgb), 0.55);
            --text: #0F172A;
            --text-dim: #64748B;
            --accent: #0D9488;
            --accent-rgb: 13, 148, 136;
            --accent2: #6D28D9;
            --accent2-rgb: 109, 40, 217;
            --accent3: #059669;
            --accent3-rgb: 5, 150, 105;
            --accent-glow: rgba(var(--accent-rgb), 0.35);
            --accent-glow2: rgba(var(--accent2-rgb), 0.35);
            --danger: #DC2626;
            --danger-rgb: 220, 38, 38;
            --danger-glow: rgba(var(--danger-rgb), 0.4);
            --warn: #B45309;
            --warn-rgb: 180, 83, 9;
            --highlight-rgb: 15, 23, 42;
            --placeholder: rgba(100, 116, 139, 0.55);
            --input-bg: rgba(241, 245, 249, 0.9);
            --input-focus-bg: #FFFFFF;
            --shadow-color: rgba(15, 23, 42, 0.12);
            --shadow-color-sm: rgba(15, 23, 42, 0.08);
            --title-1: #0F172A;
            --title-2: #0D9488;
            --title-3: #6D28D9;
            --radius: 12px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
        }

        /* ===== 配色：纯黑省电（OLED）===== */
        html[data-theme="oled"] {
            --bg: #000000;
            --surface: rgba(18, 18, 18, 0.92);
            --card-bg: rgba(18, 18, 18, 0.88);
            --border-rgb: 150, 150, 150;
            --text: #E8E8E8;
            --text-dim: #8A8A8A;
            --accent: #35E08A;
            --accent-rgb: 53, 224, 138;
            --accent2: #818CF8;
            --accent2-rgb: 129, 140, 248;
            --accent3: #35E08A;
            --accent3-rgb: 53, 224, 138;
            --danger: #F87171;
            --danger-rgb: 248, 113, 113;
            --warn: #FBBF24;
            --warn-rgb: 251, 191, 36;
            --highlight-rgb: 255, 255, 255;
            --placeholder: rgba(138, 138, 138, 0.7);
            --input-bg: rgba(24, 24, 24, 0.95);
            --input-focus-bg: #141414;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --shadow-color-sm: rgba(0, 0, 0, 0.45);
            --title-1: #E8E8E8;
            --title-2: #35E08A;
            --title-3: #818CF8;
        }

        /* ===== 配色：暖夜护眼 ===== */
        html[data-theme="warm"] {
            --bg: #1A1614;
            --surface: rgba(40, 34, 27, 0.92);
            --card-bg: rgba(40, 34, 27, 0.88);
            --border-rgb: 168, 155, 136;
            --text: #F0E6D8;
            --text-dim: #A89B88;
            --accent: #FFB74D;
            --accent-rgb: 255, 183, 77;
            --accent2: #E57373;
            --accent2-rgb: 229, 115, 115;
            --accent3: #A5D6A7;
            --accent3-rgb: 165, 214, 167;
            --danger: #EF5350;
            --danger-rgb: 239, 83, 80;
            --warn: #FFB74D;
            --warn-rgb: 255, 183, 77;
            --highlight-rgb: 255, 255, 255;
            --placeholder: rgba(168, 155, 136, 0.7);
            --input-bg: rgba(31, 27, 22, 0.95);
            --input-focus-bg: #241F19;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --shadow-color-sm: rgba(0, 0, 0, 0.38);
            --title-1: #F0E6D8;
            --title-2: #FFB74D;
            --title-3: #E57373;
        }

        /* ===== 配色：专业深蓝 ===== */
        html[data-theme="pro"] {
            --bg: #0F172A;
            --surface: rgba(30, 41, 59, 0.92);
            --card-bg: rgba(30, 41, 59, 0.88);
            --border-rgb: 148, 163, 184;
            --text: #F1F5F9;
            --text-dim: #94A3B8;
            --accent: #38BDF8;
            --accent-rgb: 56, 189, 248;
            --accent2: #A78BFA;
            --accent2-rgb: 167, 139, 250;
            --accent3: #34D399;
            --accent3-rgb: 52, 211, 153;
            --danger: #FB7185;
            --danger-rgb: 251, 113, 133;
            --warn: #FBBF24;
            --warn-rgb: 251, 191, 36;
            --highlight-rgb: 255, 255, 255;
            --placeholder: rgba(148, 163, 184, 0.7);
            --input-bg: rgba(15, 23, 42, 0.95);
            --input-focus-bg: #16233B;
            --shadow-color: rgba(0, 0, 0, 0.45);
            --shadow-color-sm: rgba(0, 0, 0, 0.35);
            --title-1: #F1F5F9;
            --title-2: #38BDF8;
            --title-3: #A78BFA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* 全面屏适配：避开刘海、圆角与底部手势条 */
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* 网格背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                /* 主网格线 */
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(var(--accent-rgb), 0.03) 39px, rgba(var(--accent-rgb), 0.03) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(var(--accent-rgb), 0.03) 39px, rgba(var(--accent-rgb), 0.03) 40px),
                /* 光晕 */
                radial-gradient(ellipse at 30% 15%, rgba(var(--accent-rgb), 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, rgba(var(--accent2-rgb), 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 85%, rgba(var(--accent3-rgb), 0.04) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        /* ===== 头部 ===== */
        .header {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
            padding-top: 12px;
        }

        .theme-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-btn:active {
            transform: scale(0.92);
            border-color: var(--border-bright);
        }

        .header .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.15), rgba(var(--accent2-rgb), 0.15));
            border: 1px solid var(--border-bright);
            box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.2), inset 0 0 20px rgba(var(--accent-rgb), 0.05);
            margin-bottom: 14px;
            font-size: 26px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--title-1) 0%, var(--title-2) 50%, var(--title-3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        /* ===== 环境警示条（本地文件 / HTTP 打开时提示） ===== */
        .env-warn {
            background: rgba(var(--warn-rgb), 0.12);
            border: 1px solid rgba(var(--warn-rgb), 0.45);
            color: var(--warn);
            border-radius: var(--radius);
            padding: 12px 14px;
            font-size: 11px;
            line-height: 1.7;
            font-family: var(--font-mono);
            letter-spacing: 0.4px;
            margin-bottom: 16px;
        }

        /* ===== 格式选择器 ===== */
        .format-selector {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            display: flex;
            margin-bottom: 18px;
            gap: 2px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px var(--shadow-color-sm);
        }

        .format-btn {
            flex: 1;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-family: var(--font-mono);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .format-btn.active {
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent);
            box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.2), inset 0 1px 0 rgba(var(--highlight-rgb), 0.05);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
        }

        /* ===== 预览行 ===== */
        .preview-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 4px;
            min-height: 18px;
        }

        .preview-text {
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* ===== 点位卡片 ===== */
        .point-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: border-color 0.35s, box-shadow 0.35s;
            position: relative;
            overflow: hidden;
        }

        /* 卡片顶部扫描线 */
        .point-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.35), transparent);
            pointer-events: none;
        }

        .point-card:focus-within {
            border-color: var(--border-bright);
            box-shadow: 0 8px 40px rgba(var(--accent-rgb), 0.1), 0 0 0 1px rgba(var(--accent-rgb), 0.1);
        }

        .point-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
            color: var(--text-dim);
        }

        .point-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 6px currentColor;
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 16px currentColor;
            }
        }

        .point-a .point-dot {
            background: var(--accent3);
            box-shadow: 0 0 12px rgba(var(--accent3-rgb), 0.6);
            color: var(--accent3);
        }

        .point-b .point-dot {
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger-glow);
            color: var(--danger);
        }

        /* 取当前点（GPS）按钮 */
        .locate-btn {
            margin-left: auto;
            height: 26px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
        }

        .locate-btn:active {
            border-color: var(--border-bright);
            background: rgba(var(--accent-rgb), 0.12);
        }

        .locate-btn:disabled {
            opacity: 0.55;
            cursor: default;
        }

        /* 输入组容器 */
        .format-inputs {
            display: none;
        }

        .format-inputs.active {
            display: block;
        }

        /* 输入行 */
        .input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .input-row:last-child {
            margin-bottom: 0;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .input-group label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
        }

        .input-group input {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            font-size: 15px;
            font-family: var(--font-mono);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
            caret-color: var(--accent);
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.15), 0 0 20px rgba(var(--accent-rgb), 0.08);
            background: var(--input-focus-bg);
        }

        .input-group input::placeholder {
            color: var(--placeholder);
        }

        .input-group .unit {
            font-size: 10px;
            color: var(--text-dim);
            margin-left: 2px;
            font-family: var(--font-mono);
        }

        /* DMS 方向选择 */
        .dir-group {
            flex: 0 0 52px;
            min-width: 52px;
        }

        .dir-group select {
            width: 100%;
            height: 42px;
            padding: 0 2px;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font-mono);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            outline: none;
            text-align: center;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.3s;
        }

        .dir-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.15);
        }

        /* DMS 符号 */
        .dms-symbol {
            font-size: 13px;
            color: var(--text-dim);
            align-self: flex-end;
            padding-bottom: 10px;
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        /* ===== 间距线 ===== */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -4px 0;
            position: relative;
            z-index: 2;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .divider-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--accent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* ===== 按钮 ===== */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            height: 50px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font-mono);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-calc {
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.2), rgba(var(--accent2-rgb), 0.2));
            color: var(--accent);
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.15), inset 0 1px 0 rgba(var(--highlight-rgb), 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-calc:active {
            transform: scale(0.96);
            box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.3);
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.3), rgba(var(--accent2-rgb), 0.3));
        }

        .btn-clear {
            background: var(--surface);
            color: var(--text-dim);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-clear:active {
            background: rgba(var(--highlight-rgb), 0.05);
            border-color: var(--border-bright);
        }

        /* ===== 结果区域 ===== */
        .result {
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px var(--shadow-color);
            display: none;
            position: relative;
            overflow: hidden;
        }

        .result::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent3-rgb), 0.4), transparent);
            pointer-events: none;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .result-main {
            text-align: center;
            margin-bottom: 16px;
        }

        .result-value {
            font-size: 44px;
            font-weight: 800;
            font-family: var(--font-mono);
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 50%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: none;
            filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.3));
        }

        .result-unit {
            font-size: 16px;
            font-weight: 500;
            color: var(--accent);
            margin-left: 4px;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            -webkit-text-fill-color: var(--accent);
        }

        .result-detail {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .detail-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 6px;
            text-align: center;
            position: relative;
            min-width: 0;
        }

        .detail-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.2), transparent);
        }

        .detail-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            font-family: var(--font-mono);
            letter-spacing: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .detail-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: calc(24px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(var(--danger-rgb), 0.2);
            border: 1px solid rgba(var(--danger-rgb), 0.4);

    <script>
        // 注册 Service Worker（PWA 离线支持）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => { });
        }

        const EARTH_RADIUS_KM = 6371;
        let currentFormat = 'decimal';

        /* ====== 格式切换 ====== */

        function setFormat(fmt) {
            if (fmt === currentFormat) return;

            // 切换前：以当前格式已填的坐标为准，自动换算并填入目标格式的输入框
            document.querySelectorAll('.point-card').forEach(card => {
                const coords = getPointCoords(card);
                if (hasPointCoords(card) &&
                    typeof coords.lat === 'number' && isFinite(coords.lat) &&
                    typeof coords.lon === 'number' && isFinite(coords.lon)) {
                    fillPointCoords(card, coords, fmt);
                }
            });

            currentFormat = fmt;

            // 更新按钮激活状态
            document.querySelectorAll('.format-btn').forEach(b => b.classList.toggle('active', b.dataset.format === fmt));

            // 更新所有点位卡片中的输入区域
            document.querySelectorAll('.format-inputs').forEach(el => {
                el.classList.toggle('active', el.dataset.format === fmt);
            });

            // 刷新各格式预览文本
            updatePreviews();
        }

        document.getElementById('formatSelector').addEventListener('click', (e) => {
            const btn = e.target.closest('.format-btn');
            if (!btn) return;
            // 切换时不清空已填数据，方便对比
            setFormat(btn.dataset.format);
        });

        /* ====== 工具函数 ====== */

        function toRad(deg) { return deg * Math.PI / 180; }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return EARTH_RADIUS_KM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // A→B 方位角：0° 为正北，顺时针增大
        function bearing(lat1, lon1, lat2, lon2) {
            const la1 = toRad(lat1), la2 = toRad(lat2);
            const dLon = toRad(lon2 - lon1);
            const y = Math.sin(dLon) * Math.cos(la2);
            const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function showToast(msg, ok) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.borderColor = ok ? 'rgba(var(--accent3-rgb), 0.4)' : 'rgba(var(--danger-rgb), 0.4)';
            t.style.background = ok ? 'rgba(var(--accent3-rgb), 0.15)' : 'rgba(var(--danger-rgb), 0.2)';
            t.style.color = ok ? 'var(--accent3)' : 'var(--danger)';
            t.style.boxShadow = ok ? '0 4px 24px rgba(var(--accent3-rgb), 0.25)' : '0 4px 24px var(--danger-glow)';
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function fmt(num, dec) { return num.toFixed(dec); }

        function smartUnit(km) {
            if (km < 0.001) return { val: km * 1e6, unit: 'mm', decimals: 1 };
            if (km < 1) return { val: km * 1000, unit: 'm', decimals: 2 };
            return { val: km, unit: 'km', decimals: 3 };
        }

        /* ====== DMS / DDM → 小数度 ====== */

        // 全部为空时返回 NaN（避免空输入被当作 0° 参与计算）
        function dmsToDecimal(d, m, s, dir) {
            if (![d, m, s].some(v => String(v).trim() !== '')) return NaN;
            let dec = (parseFloat(d) || 0) + (parseFloat(m) || 0) / 60 + (parseFloat(s) || 0) / 3600;
            if (dir === 'S' || dir === 'W') dec = -dec;
            return dec;
        }

        function ddmToDecimal(d, m, dir) {
            if (![d, m].some(v => String(v).trim() !== '')) return NaN;
            let dec = (parseFloat(d) || 0) + (parseFloat(m) || 0) / 60;
            if (dir === 'S' || dir === 'W') dec = -dec;
            return dec;
        }

        /* ====== 从点位卡片提取经纬度 ====== */

        function getPointCoords(point) {
            if (currentFormat === 'decimal') {
                const lat = parseFloat(point.querySelector('.lat-dec').value);
                const lon = parseFloat(point.querySelector('.lon-dec').value);
                return { lat, lon };
            }
            if (currentFormat === 'dms') {
                const latD = point.querySelector('.lat-d').value;
                const latM = point.querySelector('.lat-m').value;
                const latS = point.querySelector('.lat-s').value;
                const latDir = point.querySelector('.lat-dir').value;
                const lonD = point.querySelector('.lon-d').value;
                const lonM = point.querySelector('.lon-m').value;
                const lonS = point.querySelector('.lon-s').value;
                const lonDir = point.querySelector('.lon-dir').value;
                return {
                    lat: dmsToDecimal(latD, latM, latS, latDir),
                    lon: dmsToDecimal(lonD, lonM, lonS, lonDir),
                };
            }
            if (currentFormat === 'ddm') {
                const latD = point.querySelector('.lat-d').value;
                const latM = point.querySelector('.lat-m').value;
                const latDir = point.querySelector('.lat-dir').value;
                const lonD = point.querySelector('.lon-d').value;
                const lonM = point.querySelector('.lon-m').value;
                const lonDir = point.querySelector('.lon-dir').value;
                return {
                    lat: ddmToDecimal(latD, latM, latDir),
                    lon: ddmToDecimal(lonD, lonM, lonDir),
                };
            }
        }

        function getPointAlt(point) {
            return parseFloat(point.querySelector('.alt-input').value);
        }

        // 判断当前格式下该卡片是否有真实的坐标输入（任一输入框非空）
        function hasPointCoords(card) {
            const filled = sel => card.querySelector(sel).value.trim() !== '';
            if (currentFormat === 'decimal') {
                return filled('.lat-dec') && filled('.lon-dec');
            }
            if (currentFormat === 'dms') {
                return (filled('.lat-d') || filled('.lat-m') || filled('.lat-s')) &&
                       (filled('.lon-d') || filled('.lon-m') || filled('.lon-s'));
            }
            if (currentFormat === 'ddm') {
                return (filled('.lat-d') || filled('.lat-m')) &&
                       (filled('.lon-d') || filled('.lon-m'));
            }
            return false;
        }

        /* ====== 校验 ====== */

        function validateInputs() {
            const pa = document.querySelector('.point-a');
            const pb = document.querySelector('.point-b');
            const coordsA = getPointCoords(pa);
            const coordsB = getPointCoords(pb);
            const altA = getPointAlt(pa);
            const altB = getPointAlt(pb);

            const errors = [];
            const labelA = '点位 A', labelB = '点位 B';

            if (isNaN(coordsA.lat)) errors.push(labelA + '：请输入纬度');
            else if (coordsA.lat < -90 || coordsA.lat > 90) errors.push(labelA + '：纬度范围 -90° ~ 90°');
            if (isNaN(coordsA.lon)) errors.push(labelA + '：请输入经度');
            else if (coordsA.lon < -180 || coordsA.lon > 180) errors.push(labelA + '：经度范围 -180° ~ 180°');
            if (isNaN(altA)) errors.push(labelA + '：请输入海拔高度');

            if (isNaN(coordsB.lat)) errors.push(labelB + '：请输入纬度');
            else if (coordsB.lat < -90 || coordsB.lat > 90) errors.push(labelB + '：纬度范围 -90° ~ 90°');
            if (isNaN(coordsB.lon)) errors.push(labelB + '：请输入经度');
            else if (coordsB.lon < -180 || coordsB.lon > 180) errors.push(labelB + '：经度范围 -180° ~ 180°');
            if (isNaN(altB)) errors.push(labelB + '：请输入海拔高度');

            // DMS 额外校验
            if (currentFormat === 'dms') {
                const checkDms = (point, label) => {
                    const mLat = parseFloat(point.querySelector('.lat-m').value);
                    const sLat = parseFloat(point.querySelector('.lat-s').value);
                    const mLon = parseFloat(point.querySelector('.lon-m').value);
                    const sLon = parseFloat(point.querySelector('.lon-s').value);
                    if (!isNaN(mLat) && (mLat < 0 || mLat >= 60)) errors.push(label + '：纬度"分"应在 0~59');
                    if (!isNaN(sLat) && (sLat < 0 || sLat >= 60)) errors.push(label + '：纬度"秒"应在 0~59');
                    if (!isNaN(mLon) && (mLon < 0 || mLon >= 60)) errors.push(label + '：经度"分"应在 0~59');
                    if (!isNaN(sLon) && (sLon < 0 || sLon >= 60)) errors.push(label + '：经度"秒"应在 0~59');
                };
                checkDms(pa, labelA);
                checkDms(pb, labelB);
            }
            if (currentFormat === 'ddm') {
                const checkDdm = (point, label) => {
                    const mLat = parseFloat(point.querySelector('.lat-m').value);
                    const mLon = parseFloat(point.querySelector('.lon-m').value);
                    if (!isNaN(mLat) && (mLat < 0 || mLat >= 60)) errors.push(label + '：纬度"分"应在 0~59');
                    if (!isNaN(mLon) && (mLon < 0 || mLon >= 60)) errors.push(label + '：经度"分"应在 0~59');
                };
                checkDdm(pa, labelA);
                checkDdm(pb, labelB);
            }

            return { errors, coordsA, coordsB, altA, altB };
        }

        /* ====== 小数度 → DMS/DDM 显示预览 ====== */

        function decimalToDMS(dec, isLat) {
            const sign = dec < 0 ? -1 : 1;
            const abs = Math.abs(dec);
            const d = Math.floor(abs);
            const mFull = (abs - d) * 60;
            const m = Math.floor(mFull);
            const s = (mFull - m) * 60;
            const dir = isLat ? (sign < 0 ? 'S' : 'N') : (sign < 0 ? 'W' : 'E');
            return { d, m, s, dir };
        }

        function updatePreviews() {
            document.querySelectorAll('.point-card').forEach(card => {
                const coords = getPointCoords(card);
                // DMS / DDM 两个区域都是"当前输入 → 小数度"的预览，逻辑一致
                ['dms', 'ddm'].forEach(name => {
                    const box = card.querySelector(`.format-inputs[data-format="${name}"]`);
                    if (!box) return;
                    const latEl = box.querySelector('.lat-preview');
                    const lonEl = box.querySelector('.lon-preview');
                    if (latEl) latEl.textContent = isNaN(coords.lat) ? '' : `→ 小数：${fmt(coords.lat, 6)}°`;
                    if (lonEl) lonEl.textContent = isNaN(coords.lon) ? '' : `→ 小数：${fmt(coords.lon, 6)}°`;
                });
            });
        }

        // 监听所有输入变化，实时更新预览
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', updatePreviews);
        });
        document.querySelectorAll('select').forEach(sel => {
            sel.addEventListener('change', updatePreviews);
        });

        /* ====== 计算 ====== */

        let lastResult = null;

        function calculate() {
            const { errors, coordsA, coordsB, altA, altB } = validateInputs();
            if (errors.length > 0) { showToast(errors[0]); return; }

            const groundKm = haversineDistance(coordsA.lat, coordsA.lon, coordsB.lat, coordsB.lon);
            const altDiffKm = (altB - altA) / 1000;
            const straightKm = Math.sqrt(groundKm ** 2 + altDiffKm ** 2);

            const resultEl = document.getElementById('result');
            resultEl.classList.add('show');

            const su = smartUnit(straightKm);
            document.getElementById('resultValue').textContent = fmt(su.val, su.decimals);
            document.getElementById('resultUnit').textContent = su.unit;

            const gu = smartUnit(groundKm);
            document.getElementById('groundDist').textContent = fmt(gu.val, gu.decimals) + ' ' + gu.unit;

            const ad = Math.abs(altB - altA);
            document.getElementById('altDiff').textContent = ad >= 1000 ? fmt(ad / 1000, 2) + ' km' : fmt(ad, 1) + ' m';

            const brg = bearing(coordsA.lat, coordsA.lon, coordsB.lat, coordsB.lon);
            document.getElementById('bearingVal').textContent = fmt(brg, 1) + '°';

            // 保存本次结果供复制使用，并自动记入历史
            const rec = makeRecord(coordsA, coordsB, altA, altB, straightKm, groundKm);
            lastResult = rec;
            addRecord(rec);
            renderHistory();
            renderStats();

            // 小屏手机上自动滚到结果，避免手动翻找
            setTimeout(() => resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
        }

        /* ====== 清空 ====== */

        function clearAll() {
            const hasInput = Array.from(document.querySelectorAll('.point-card input'))
                .some(input => input.value.trim() !== '');
            if (hasInput && !confirm('确定清空已填写的坐标与海拔吗？')) return;
            document.querySelectorAll('.point-card input').forEach(input => { input.value = ''; });
            document.querySelectorAll('.point-card select').forEach(sel => { sel.selectedIndex = 0; });
            document.getElementById('result').classList.remove('show');
            updatePreviews();
        }

        /* ====== 历史记录（localStorage 持久化） ====== */

        const STORE_KEY = 'rangingData_v1';
        const MAX_HISTORY = 100;

        function loadData() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return { totalCount: 0, history: [] };
                const d = JSON.parse(raw);
                return {
                    totalCount: Number(d.totalCount) || 0,
                    history: Array.isArray(d.history) ? d.history : [],
                };
            } catch (e) {
                return { totalCount: 0, history: [] };
            }
        }

        function saveData(d) {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(d));
            } catch (e) {
                showToast('存储失败：' + (e && e.message ? e.message : '存储空间不足'));
            }
        }

        function makeRecord(coordsA, coordsB, altA, altB, straightKm, groundKm) {
            return {
                id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                time: Date.now(),
                format: currentFormat,
                a: { lat: coordsA.lat, lon: coordsA.lon, alt: altA },
                b: { lat: coordsB.lat, lon: coordsB.lon, alt: altB },
                straightKm: straightKm,
                groundKm: groundKm,
                altDiffM: altB - altA,
            };
        }

        function addRecord(rec) {
            const d = loadData();
            d.totalCount += 1;
            d.history.unshift(rec);
            if (d.history.length > MAX_HISTORY) d.history.length = MAX_HISTORY;
            saveData(d);
        }

        function deleteRecord(id) {
            const d = loadData();
            const before = d.history.length;
            d.history = d.history.filter(r => r.id !== id);
            if (d.history.length === before) return;
            saveData(d);
            renderHistory();
            renderStats();
            showToast('已删除该记录', true);
        }

        function clearHistory() {
            const d = loadData();
            if (d.history.length === 0) { showToast('暂无历史记录'); return; }
            if (!confirm('确定要清空全部 ' + d.history.length + ' 条历史记录吗？')) return;
            d.history = [];
            saveData(d);
            renderHistory();
            renderStats();
            showToast('已清空历史记录', true);
        }

        /* ====== 导出 / 导入 ====== */

        function exportHistory() {
            const d = loadData();
            const pd = loadPlaces();
            if (d.history.length === 0 && pd.places.length === 0) {
                showToast('暂无可导出的记录');
                return;
            }
            const payload = {
                app: '丈量',
                version: 2,
                exportedAt: new Date().toISOString(),
                totalCount: d.totalCount,
                history: d.history,
                places: pd.places,
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '丈量数据_' + fmtDate(new Date()) + '.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
            showToast('已导出 ' + d.history.length + ' 条历史、' + pd.places.length + ' 条位置', true);
        }

        function importHistory(e) {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    const histList = Array.isArray(data) ? data : (Array.isArray(data.history) ? data.history : []);
                    const placeList = (!Array.isArray(data) && Array.isArray(data.places)) ? data.places : [];
                    if (histList.length === 0 && placeList.length === 0) {
                        showToast('导入失败：文件里没有记录');
                        return;
                    }

                    // 历史记录：按 id 去重合并
                    const d = loadData();
                    const seen = new Set(d.history.map(r => r.id));
                    let addedH = 0;
                    for (const r of histList) {
                        // 只接受结构合法、id 仅含安全字符的记录
                        if (r && typeof r.id === 'string' && /^[A-Za-z0-9_-]+$/.test(r.id) &&
                            typeof r.straightKm === 'number' && !seen.has(r.id)) {
                            d.history.push(r);
                            seen.add(r.id);
                            addedH++;
                        }
                    }
                    d.history.sort((x, y) => (y.time || 0) - (x.time || 0));
                    if (d.history.length > MAX_HISTORY) d.history.length = MAX_HISTORY;
                    saveData(d);

                    // 位置记录：同样按 id 去重合并
                    const pd = loadPlaces();
                    const seenP = new Set(pd.places.map(p => p.id));
                    let addedP = 0;
                    for (const p of placeList) {
                        if (p && typeof p.id === 'string' && /^[A-Za-z0-9_-]+$/.test(p.id) &&
                            typeof p.lat === 'number' && typeof p.lon === 'number' && !seenP.has(p.id)) {
                            pd.places.push(p);
                            seenP.add(p.id);
                            addedP++;
                        }
                    }
                    pd.places.sort((x, y) => (y.time || 0) - (x.time || 0));
                    if (pd.places.length > MAX_PLACES) pd.places.length = MAX_PLACES;
                    savePlaces(pd);

                    renderHistory();
                    renderStats();
                    renderPlaces();
                    showToast(addedH + addedP > 0
                        ? ('导入成功：新增 ' + addedH + ' 条历史、' + addedP + ' 条位置')
                        : '没有新记录可导入', true);
                } catch (err) {
                    showToast('导入失败：' + (err && err.message ? err.message : '文件解析错误'));
                }
            };
            reader.readAsText(file);
        }

        /* ====== 渲染 ====== */

        const FORMAT_NAMES = { decimal: '小数度', dms: '度分秒', ddm: '度·分' };

        function fmtTime(ts) {
            if (!ts) return '--';
            const d = new Date(ts);
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
            if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
            if (d.getFullYear() === now.getFullYear()) return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
        }

        function fmtDate(d) {
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
        }

        function renderHistory() {
            const d = loadData();
            const listEl = document.getElementById('historyList');
            document.getElementById('historyCount').textContent = d.history.length;

            if (d.history.length === 0) {
                listEl.innerHTML = '<div class="history-empty">暂无历史记录<br>计算结果将自动保存到这里</div>';
                return;
            }

            listEl.innerHTML = d.history.map(r => {
                const su = (typeof r.straightKm === 'number' && isFinite(r.straightKm)) ? smartUnit(r.straightKm) : null;
                const a = r.a || {}, b = r.b || {};
                const latA = typeof a.lat === 'number' ? fmt(a.lat, 4) : '--';
                const lonA = typeof a.lon === 'number' ? fmt(a.lon, 4) : '--';
                const latB = typeof b.lat === 'number' ? fmt(b.lat, 4) : '--';
                const lonB = typeof b.lon === 'number' ? fmt(b.lon, 4) : '--';
                const distHtml = su ? fmt(su.val, su.decimals) + '<em>' + su.unit + '</em>' : '<em>--</em>';
                const coords = 'A ' + latA + '°, ' + lonA + '° → B ' + latB + '°, ' + lonB + '°';
                const fmtName = FORMAT_NAMES[r.format] ? ' · ' + FORMAT_NAMES[r.format] : '';
                const noteHtml = r.note ? '<div class="history-note">📝 ' + escapeHtml(r.note) + '</div>' : '';
                // 只保留安全字符，避免导入数据里的 id 破坏 onclick 属性
                const sid = String(r.id).replace(/[^A-Za-z0-9_-]/g, '');
                return '<div class="history-item">'
                    + '<div class="history-top">'
                    + '<span class="history-dist">' + distHtml + '</span>'
                    + '<span class="history-time">' + fmtTime(r.time) + '</span>'
                    + '</div>'
                    + '<div class="history-coords">' + coords + fmtName + '</div>'
                    + noteHtml
                    + '<div class="history-actions">'
                    + '<button class="mini-btn" onclick="restoreRecord(\'' + sid + '\')">↩ 回填</button>'
                    + '<button class="mini-btn" onclick="copyRecord(\'' + sid + '\')">⧉ 复制</button>'
                    + '<button class="mini-btn" onclick="editNote(\'' + sid + '\')">✏️ 备注</button>'
                    + '<button class="mini-btn mini-btn-danger" onclick="deleteRecord(\'' + sid + '\')">✕ 删除</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        function renderStats() {
            const d = loadData();
            document.getElementById('statTotal').textContent = d.totalCount;
            const today = new Date().toDateString();
            const todayCount = d.history.filter(r => r.time && new Date(r.time).toDateString() === today).length;
            document.getElementById('statToday').textContent = todayCount;
            const recent = d.history[0];
            if (recent && typeof recent.straightKm === 'number' && isFinite(recent.straightKm)) {
                const su = smartUnit(recent.straightKm);
                document.getElementById('statRecent').textContent = fmt(su.val, su.decimals) + su.unit;
            } else {
                document.getElementById('statRecent').textContent = '--';
            }
        }

        /* ====== 位置记录（按时间保存当前位置，事后可填入） ====== */

        const PLACE_KEY = 'rangingPlaces_v1';
        const MAX_PLACES = 200;

        function loadPlaces() {
            try {
                const raw = localStorage.getItem(PLACE_KEY);
                if (!raw) return { places: [] };
                const d = JSON.parse(raw);
                return { places: Array.isArray(d.places) ? d.places : [] };
            } catch (e) {
                return { places: [] };
            }
        }

        function savePlaces(d) {
            try {
                localStorage.setItem(PLACE_KEY, JSON.stringify(d));
            } catch (e) {
                showToast('存储失败：' + (e && e.message ? e.message : '存储空间不足'));
            }
        }

        function addPlace(place) {
            const d = loadPlaces();
            d.places.unshift(place);
            if (d.places.length > MAX_PLACES) d.places.length = MAX_PLACES;
            savePlaces(d);
        }

        function findPlace(id) {
            return loadPlaces().places.find(p => p.id === id);
        }

        function deletePlace(id) {
            const d = loadPlaces();
            const before = d.places.length;
            d.places = d.places.filter(p => p.id !== id);
            if (d.places.length === before) return;
            savePlaces(d);
            renderPlaces();
            showToast('已删除该位置记录', true);
        }

        function clearPlaces() {
            const d = loadPlaces();
            if (d.places.length === 0) { showToast('暂无位置记录'); return; }
            if (!confirm('确定要清空全部 ' + d.places.length + ' 条位置记录吗？')) return;
            d.places = [];
            savePlaces(d);
            renderPlaces();
            showToast('已清空位置记录', true);
        }

        // 把某条位置记录填入点位 A / B
        function fillPlaceInto(id, which) {
            const p = findPlace(id);
            if (!p) return;
            const card = document.querySelector(which === 'a' ? '.point-a' : '.point-b');
            if (!card) return;
            fillPointCoords(card, { lat: p.lat, lon: p.lon }, currentFormat);
            if (typeof p.alt === 'number' && isFinite(p.alt)) {
                card.querySelector('.alt-input').value = p.alt;
            }
            updatePreviews();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('已填入点位 ' + which.toUpperCase() + '（' + fmtTime(p.time) + '）', true);
        }

        function editPlaceNote(id) {
            const d = loadPlaces();
            const p = d.places.find(x => x.id === id);
            if (!p) return;
            const v = prompt('给这个位置加个备注（留空则删除备注）：', p.note || '');
            if (v === null) return;
            const note = v.trim().slice(0, 40);
            if (note) p.note = note; else delete p.note;
            savePlaces(d);
            renderPlaces();
            showToast(note ? '备注已保存' : '备注已清除', true);
        }

        function renderPlaces() {
            const d = loadPlaces();
            const listEl = document.getElementById('placeList');
            document.getElementById('placeCount').textContent = d.places.length;

            if (d.places.length === 0) {
                listEl.innerHTML = '<div class="history-empty">暂无位置记录<br>点「记录当前位置」用 GPS 按时间保存坐标</div>';
                return;
            }

            listEl.innerHTML = d.places.map(p => {
                const latOk = typeof p.lat === 'number' && isFinite(p.lat);
                const lonOk = typeof p.lon === 'number' && isFinite(p.lon);
                const coord = (latOk ? fmt(p.lat, 5) : '--') + ', ' + (lonOk ? fmt(p.lon, 5) : '--');
                const meta = [fmtTime(p.time)];
                if (typeof p.alt === 'number' && isFinite(p.alt)) meta.push('海拔 ' + p.alt + ' m');
                if (typeof p.acc === 'number' && isFinite(p.acc)) meta.push('精度 ±' + p.acc + ' m');
                const noteHtml = p.note ? '<div class="history-note">📝 ' + escapeHtml(p.note) + '</div>' : '';
                const sid = String(p.id).replace(/[^A-Za-z0-9_-]/g, '');
                return '<div class="history-item">'
                    + '<div class="place-coord">' + coord + '</div>'
                    + '<div class="history-coords">' + meta.join(' · ') + '</div>'
                    + noteHtml
                    + '<div class="history-actions">'
                    + '<button class="mini-btn" onclick="fillPlaceInto(\'' + sid + '\', \'a\')">填入A</button>'
                    + '<button class="mini-btn" onclick="fillPlaceInto(\'' + sid + '\', \'b\')">填入B</button>'
                    + '<button class="mini-btn" onclick="editPlaceNote(\'' + sid + '\')">✏️</button>'
                    + '<button class="mini-btn mini-btn-danger" onclick="deletePlace(\'' + sid + '\')">✕</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        /* ====== 一键回填 ====== */

        function trimNum(v) { return Math.round(v * 1e6) / 1e6; }

        function round1(v) { return Math.round(v * 10) / 10; }

        function decimalToDDM(dec, isLat) {
            const sign = dec < 0 ? -1 : 1;
            const abs = Math.abs(dec);
            const d = Math.floor(abs);
            const m = (abs - d) * 60;
            const dir = isLat ? (sign < 0 ? 'S' : 'N') : (sign < 0 ? 'W' : 'E');
            return { d, m, dir };
        }

        function fillPoint(card, p) {
            if (!p) return;
            card.querySelector('.alt-input').value = (p.alt != null && !isNaN(p.alt)) ? p.alt : '';
            fillPointCoords(card, { lat: p.lat, lon: p.lon }, currentFormat);
        }

        // 把坐标换算后填入指定格式的输入框（不动海拔，海拔三种格式共用）
        function fillPointCoords(card, coords, fmt) {
            const latOk = typeof coords.lat === 'number' && isFinite(coords.lat);
            const lonOk = typeof coords.lon === 'number' && isFinite(coords.lon);
            if (fmt === 'decimal') {
                card.querySelector('.lat-dec').value = latOk ? coords.lat : '';
                card.querySelector('.lon-dec').value = lonOk ? coords.lon : '';
            } else if (fmt === 'dms') {
                const la = decimalToDMS(latOk ? coords.lat : 0, true);
                const lo = decimalToDMS(lonOk ? coords.lon : 0, false);
                card.querySelector('.lat-d').value = latOk ? la.d : '';
                card.querySelector('.lat-m').value = latOk ? la.m : '';
                card.querySelector('.lat-s').value = latOk ? trimNum(la.s) : '';
                card.querySelector('.lat-dir').value = latOk ? la.dir : 'N';
                card.querySelector('.lon-d').value = lonOk ? lo.d : '';
                card.querySelector('.lon-m').value = lonOk ? lo.m : '';
                card.querySelector('.lon-s').value = lonOk ? trimNum(lo.s) : '';
                card.querySelector('.lon-dir').value = lonOk ? lo.dir : 'E';
            } else if (fmt === 'ddm') {
                const la = decimalToDDM(latOk ? coords.lat : 0, true);
                const lo = decimalToDDM(lonOk ? coords.lon : 0, false);
                card.querySelector('.lat-d').value = latOk ? la.d : '';
                card.querySelector('.lat-m').value = latOk ? trimNum(la.m) : '';
                card.querySelector('.lat-dir').value = latOk ? la.dir : 'N';
                card.querySelector('.lon-d').value = lonOk ? lo.d : '';
                card.querySelector('.lon-m').value = lonOk ? trimNum(lo.m) : '';
                card.querySelector('.lon-dir').value = lonOk ? lo.dir : 'E';
            }
        }

        function restoreRecord(id) {
            const d = loadData();
            const rec = d.history.find(r => r.id === id);
            if (!rec) return;
            setFormat(rec.format && FORMAT_NAMES[rec.format] ? rec.format : 'decimal');
            fillPoint(document.querySelector('.point-a'), rec.a);
            fillPoint(document.querySelector('.point-b'), rec.b);
            updatePreviews();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('已回填，可点击「计算距离」复查', true);
        }

        /* ====== GPS 定位（取点 / 记录位置共用） ====== */

        function geoErrMsg(err) {
            const msgs = {
                1: '定位被拒绝：请在浏览器/系统设置里允许获取位置',
                2: '无法获取位置：请确认已开启 GPS 与网络后重试',
                3: '定位超时：请到空旷处或开启 GPS 后重试',
            };
            return msgs[err && err.code] || '定位失败，请重试';
        }

        // 判断当前是否属于"浏览器禁止定位"的打开方式，返回原因文案（正常返回空串）
        function geoBlockReason() {
            const proto = location.protocol;
            if (proto === 'file:' || proto === 'content:') {
                return '本地文件方式无法定位：请把页面放到 https:// 网址上再打开';
            }
            if (!window.isSecureContext) {
                return 'HTTP 页面被浏览器禁止定位：请改用 https:// 网址访问';
            }
            return '';
        }

        // 共用流程：按钮置忙 → 定位成功回调 / 失败提示 → 恢复按钮
        function withGeolocation(btn, onSuccess) {
            if (!navigator.geolocation) {
                showToast('当前浏览器不支持定位');
                return;
            }
            const blocked = geoBlockReason();
            if (blocked) {
                showToast(blocked);
                return;
            }
            const original = btn ? btn.textContent : '';
            if (btn) {
                btn.disabled = true;
                btn.textContent = '定位中…';
            }
            const restore = () => {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = original;
                }
            };

            navigator.geolocation.getCurrentPosition((pos) => {
                try {
                    onSuccess(pos.coords);
                } catch (e) {
                    showToast('处理定位结果失败');
                }
                restore();
            }, (err) => {
                restore();
                showToast(geoErrMsg(err));
            }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
        }

        // 取当前点：直接填入输入框（不保存）
        function locatePoint(which, btn) {
            const card = document.querySelector(which === 'a' ? '.point-a' : '.point-b');
            if (!card) return;
            withGeolocation(btn, (c) => {
                fillPointCoords(card, { lat: c.latitude, lon: c.longitude }, currentFormat);
                // 有海拔才覆盖，避免把用户已填的海拔清空
                if (c.altitude != null && isFinite(c.altitude)) {
                    card.querySelector('.alt-input').value = round1(c.altitude);
                }
                updatePreviews();
                const acc = isFinite(c.accuracy) ? Math.round(c.accuracy) : null;
                const hasAlt = c.altitude != null && isFinite(c.altitude);
                showToast('已取点（' + (acc != null ? '精度约 ' + acc + ' 米' : '无精度信息') +
                    (hasAlt ? '，含海拔' : '，本机未提供海拔') + '）', true);
            });
        }

        // 记录当前位置：带时间保存到「位置记录」，事后可填入 A/B
        function recordCurrentPlace(btn) {
            withGeolocation(btn, (c) => {
                const place = {
                    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                    time: Date.now(),
                    lat: c.latitude,
                    lon: c.longitude,
                    alt: (c.altitude != null && isFinite(c.altitude)) ? round1(c.altitude) : null,
                    acc: isFinite(c.accuracy) ? Math.round(c.accuracy) : null,
                };
                addPlace(place);
                renderPlaces();
                showToast('已记录位置（' + (place.acc != null ? '精度约 ' + place.acc + ' 米' : '已保存') + '）', true);
            });
        }

        /* ====== 复制 ====== */

        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); }
            catch (e) { showToast('复制失败：请手动复制'); }
            ta.remove();
        }

        function copyText(text, okMsg) {
            const done = () => showToast(okMsg || '已复制到剪贴板', true);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }

        function formatResultText(rec) {
            if (!rec) return '';
            const su = (typeof rec.straightKm === 'number' && isFinite(rec.straightKm)) ? smartUnit(rec.straightKm) : null;
            const gu = (typeof rec.groundKm === 'number' && isFinite(rec.groundKm)) ? smartUnit(rec.groundKm) : null;
            const ad = Math.abs(rec.altDiffM);
            const altStr = isFinite(ad) ? (ad >= 1000 ? fmt(ad / 1000, 2) + ' km' : fmt(ad, 1) + ' m') : '--';
            const a = rec.a || {}, b = rec.b || {};
            const latA = typeof a.lat === 'number' ? fmt(a.lat, 6) : '--';
            const lonA = typeof a.lon === 'number' ? fmt(a.lon, 6) : '--';
            const latB = typeof b.lat === 'number' ? fmt(b.lat, 6) : '--';
            const lonB = typeof b.lon === 'number' ? fmt(b.lon, 6) : '--';
            const canBrg = typeof a.lat === 'number' && typeof a.lon === 'number' &&
                typeof b.lat === 'number' && typeof b.lon === 'number';
            const brgStr = canBrg ? fmt(bearing(a.lat, a.lon, b.lat, b.lon), 1) + '°' : '--';
            return [
                '丈量 · 测距结果' + (rec.time ? ' · ' + fmtTime(rec.time) : ''),
                '直线距离: ' + (su ? fmt(su.val, su.decimals) + ' ' + su.unit : '--'),
                '地面距离: ' + (gu ? fmt(gu.val, gu.decimals) + ' ' + gu.unit : '--'),
                '高差: ' + altStr,
                'A→B 方位角: ' + brgStr,
                'A: ' + latA + '°, ' + lonA + '° (海拔 ' + (a.alt != null ? a.alt : '--') + ' m)',
                'B: ' + latB + '°, ' + lonB + '° (海拔 ' + (b.alt != null ? b.alt : '--') + ' m)',
            ].join('\n');
        }

        function copyResult() {
            if (!lastResult) { showToast('请先计算距离'); return; }
            copyText(formatResultText(lastResult));
        }

        function copyRecord(id) {
            const d = loadData();
            const rec = d.history.find(r => r.id === id);
            if (!rec) return;
            copyText(formatResultText(rec));
        }

        // 调用系统分享面板，不支持时退回复制
        function shareResult() {
            if (!lastResult) { showToast('请先计算距离'); return; }
            const text = formatResultText(lastResult);
            if (navigator.share) {
                navigator.share({ title: '丈量 · 测距结果', text: text }).catch(() => { });
            } else {
                copyText(text, '本机不支持分享，已复制到剪贴板');
            }
        }

        /* ====== 历史记录备注 ====== */

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        function editNote(id) {
            const d = loadData();
            const rec = d.history.find(r => r.id === id);
            if (!rec) return;
            const v = prompt('给这条记录加个备注（留空则删除备注）：', rec.note || '');
            if (v === null) return;
            const note = v.trim().slice(0, 40);
            if (note) rec.note = note; else delete rec.note;
            saveData(d);
            renderHistory();
            showToast(note ? '备注已保存' : '备注已清除', true);
        }

        /* ====== 粘贴解析坐标 ====== */

        // 从任意文本解析出一对经纬度：支持 小数度 / 度分秒 / 度·分 / 带方向字母 / "经度在前"的写法
        function parseCoordText(text) {
            if (!text) return null;
            const t = String(text).trim().replace(/[ \t\r\n]+/g, ' ');

            // 1) 带方向字母的度分秒/度分，例如 39°54'15.1"N 116°24'26.6"E
            const re = /([0-9]+(?:[.][0-9]+)?)[ ]*[°º][ ]*(?:([0-9]+(?:[.][0-9]+)?)[ ]*['′’][ ]*)?(?:([0-9]+(?:[.][0-9]+)?)[ ]*["″”][ ]*)?[ ]*([NSEWnsew])/g;
            const hits = [];
            let m;
            while ((m = re.exec(t)) !== null) {
                let dec = (parseFloat(m[1]) || 0) + (parseFloat(m[2]) || 0) / 60 + (parseFloat(m[3]) || 0) / 3600;
                const dir = m[4].toUpperCase();
                if (dir === 'S' || dir === 'W') dec = -dec;
                hits.push({ dir: dir, dec: dec });
                if (hits.length >= 2) break;
            }
            if (hits.length >= 2) {
                const latHit = hits.find(h => h.dir === 'N' || h.dir === 'S');
                const lonHit = hits.find(h => h.dir === 'E' || h.dir === 'W');
                if (latHit && lonHit) return { lat: latHit.dec, lon: lonHit.dec };
                return { lat: hits[0].dec, lon: hits[1].dec };
            }

            // 2) 纯数字对，例如 39.9042, 116.4074
            const nums = t.match(/-?[0-9]+(?:[.][0-9]+)?/g);
            if (!nums || nums.length < 2) return null;
            let lat = parseFloat(nums[0]);
            let lon = parseFloat(nums[1]);
            // 兼容"经度在前"的写法：纬度不可能超过 90°
            if (Math.abs(lat) > 90 && Math.abs(lon) <= 90) {
                const tmp = lat;
                lat = lon;
                lon = tmp;
            }
            if (!isFinite(lat) || !isFinite(lon)) return null;
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
            return { lat: lat, lon: lon };
        }

        // 在坐标输入框里粘贴整串坐标时自动拆分填入
        document.querySelectorAll('.point-card input:not(.alt-input)').forEach(input => {
            input.addEventListener('paste', (e) => {
                const cb = e.clipboardData || window.clipboardData;
                const text = cb ? cb.getData('text') : '';
                const parsed = parseCoordText(text);
                if (!parsed) return; // 认不出来就按普通粘贴处理
                e.preventDefault();
                const card = input.closest('.point-card');
                if (!card) return;
                fillPointCoords(card, parsed, currentFormat);
                updatePreviews();
                showToast('已识别坐标并填入', true);
            });
        });

        /* ====== 回车触发 ====== */

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); calculate(); }
            });
        });

        /* ====== 配色主题 ====== */

        const THEME_KEY = 'rangingTheme_v1';
        const THEMES = [
            { id: 'outdoor', icon: '☀️', label: '户外强光', color: '#F1F5F9' },
            { id: 'oled', icon: '⚡', label: '纯黑省电', color: '#000000' },
            { id: 'warm', icon: '🌙', label: '暖夜护眼', color: '#1A1614' },
            { id: 'pro', icon: '📐', label: '专业深蓝', color: '#0F172A' },
        ];

        function applyTheme(id) {
            const t = THEMES.find(x => x.id === id) || THEMES[0];
            document.documentElement.setAttribute('data-theme', t.id);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', t.color);
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.textContent = t.icon;
                btn.title = '配色：' + t.label + '（点击切换）';
            }
            try { localStorage.setItem(THEME_KEY, t.id); } catch (e) { }
        }

        function cycleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') || 'outdoor';
            const idx = THEMES.findIndex(x => x.id === cur);
            const next = THEMES[((idx < 0 ? 0 : idx) + 1) % THEMES.length];
            applyTheme(next.id);
            showToast('配色：' + next.label, true);
        }

        /* ====== 初始化 ====== */

        document.getElementById('importFile').addEventListener('change', importHistory);
        renderHistory();
        renderStats();
        renderPlaces();

        // 应用已保存的配色（同时同步状态栏颜色与按钮图标）
        let savedTheme = '';
        try { savedTheme = localStorage.getItem(THEME_KEY) || ''; } catch (e) { }
        applyTheme(savedTheme || 'outdoor');

        // 环境提醒：本地文件 / HTTP 打开时，定位与数据保存都会受限
        (function checkEnv() {
            const el = document.getElementById('envWarn');
            if (!el) return;
            const reason = geoBlockReason();
            if (!reason) {
                el.style.display = 'none';
                return;
            }
            const proto = location.protocol;
            let msg = '⚠️ ' + reason;
            if (proto === 'file:' || proto === 'content:') {
                msg += '<br>另外：本地文件方式下「历史记录 / 位置记录」可能无法保存，也无法安装到桌面。';
                msg += '<br>建议部署到 https:// 网址（如 Vercel / GitHub Pages）后从浏览器打开。';
            } else {
                msg += '<br>可临时用 https 隧道（如 cloudflared / ngrok）在手机上访问。';
            }
            el.innerHTML = msg;
            el.style.display = 'block';
        })();

        // 配合 manifest 的 shortcuts：长按桌面图标可直接跳到对应区块
        const viewTarget = {
            history: 'historySection',
            places: 'placeSection',
        }[new URLSearchParams(location.search).get('view')];
        if (viewTarget) {
            setTimeout(() => {
                const el = document.getElementById(viewTarget);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

    </script>
</body>

</html>
