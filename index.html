<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#060b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="三维测距">
    <link rel="manifest" href="manifest.json">
    <title>三维测距工具</title>
    <style>
        :root {
            --bg: #060b14;
            --surface: rgba(12, 20, 40, 0.85);
            --card-bg: rgba(14, 24, 48, 0.75);
            --border: rgba(56, 189, 248, 0.18);
            --border-bright: rgba(56, 189, 248, 0.45);
            --text: #e0f0ff;
            --text-dim: #5c7a9a;
            --accent: #00e5ff;
            --accent2: #7c4dff;
            --accent3: #00e676;
            --accent-glow: rgba(0, 229, 255, 0.35);
            --accent-glow2: rgba(124, 77, 255, 0.35);
            --danger: #ff3d71;
            --danger-glow: rgba(255, 61, 113, 0.4);
            --input-bg: rgba(8, 16, 32, 0.7);
            --radius: 12px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* 网格背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                /* 主网格线 */
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0, 229, 255, 0.03) 39px, rgba(0, 229, 255, 0.03) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0, 229, 255, 0.03) 39px, rgba(0, 229, 255, 0.03) 40px),
                /* 光晕 */
                radial-gradient(ellipse at 30% 15%, rgba(0, 229, 255, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, rgba(124, 77, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 85%, rgba(0, 230, 118, 0.04) 0%, transparent 50%);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 12px;
        }

        .header .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(124, 77, 255, 0.15));
            border: 1px solid var(--border-bright);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.05);
            margin-bottom: 14px;
            font-size: 26px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e0f0ff 0%, #80d8ff 50%, #b388ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        /* ===== 格式选择器 ===== */
        .format-selector {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            display: flex;
            margin-bottom: 18px;
            gap: 2px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .format-btn {
            flex: 1;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-family: var(--font-mono);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .format-btn.active {
            background: rgba(0, 229, 255, 0.12);
            color: var(--accent);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        /* ===== 预览行 ===== */
        .preview-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 4px;
            min-height: 18px;
        }

        .preview-text {
            font-size: 10px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        /* ===== 点位卡片 ===== */
        .point-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: border-color 0.35s, box-shadow 0.35s;
            position: relative;
            overflow: hidden;
        }

        /* 卡片顶部扫描线 */
        .point-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.35), transparent);
            pointer-events: none;
        }

        .point-card:focus-within {
            border-color: var(--border-bright);
            box-shadow: 0 8px 40px rgba(0, 229, 255, 0.1), 0 0 0 1px rgba(0, 229, 255, 0.1);
        }

        .point-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
            color: var(--text-dim);
        }

        .point-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 6px currentColor;
            }

            50% {
                opacity: 0.5;
                box-shadow: 0 0 16px currentColor;
            }
        }

        .point-a .point-dot {
            background: var(--accent3);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
            color: var(--accent3);
        }

        .point-b .point-dot {
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger-glow);
            color: var(--danger);
        }

        /* 输入组容器 */
        .format-inputs {
            display: none;
        }

        .format-inputs.active {
            display: block;
        }

        /* 输入行 */
        .input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .input-row:last-child {
            margin-bottom: 0;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .input-group label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: var(--font-mono);
        }

        .input-group input {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            font-size: 15px;
            font-family: var(--font-mono);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
            caret-color: var(--accent);
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.15), 0 0 20px rgba(0, 229, 255, 0.08);
            background: rgba(8, 20, 40, 0.9);
        }

        .input-group input::placeholder {
            color: rgba(90, 120, 150, 0.5);
        }

        .input-group .unit {
            font-size: 10px;
            color: var(--text-dim);
            margin-left: 2px;
            font-family: var(--font-mono);
        }

        /* DMS 方向选择 */
        .dir-group {
            flex: 0 0 52px;
            min-width: 52px;
        }

        .dir-group select {
            width: 100%;
            height: 42px;
            padding: 0 2px;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font-mono);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            outline: none;
            text-align: center;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.3s;
        }

        .dir-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.15);
        }

        /* DMS 符号 */
        .dms-symbol {
            font-size: 13px;
            color: var(--text-dim);
            align-self: flex-end;
            padding-bottom: 10px;
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        /* ===== 间距线 ===== */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -4px 0;
            position: relative;
            z-index: 2;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .divider-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--accent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* ===== 按钮 ===== */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            height: 50px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font-mono);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-calc {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(124, 77, 255, 0.2));
            color: var(--accent);
            border: 1px solid rgba(0, 229, 255, 0.35);
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-calc:active {
            transform: scale(0.96);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.3), rgba(124, 77, 255, 0.3));
        }

        .btn-clear {
            background: var(--surface);
            color: var(--text-dim);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-clear:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-bright);
        }

        /* ===== 结果区域 ===== */
        .result {
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
            position: relative;
            overflow: hidden;
        }

        .result::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 230, 118, 0.4), transparent);
            pointer-events: none;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .result-main {
            text-align: center;
            margin-bottom: 16px;
        }

        .result-value {
            font-size: 44px;
            font-weight: 800;
            font-family: var(--font-mono);
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 50%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
            text-shadow: none;
            filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.3));
        }

        .result-unit {
            font-size: 16px;
            font-weight: 500;
            color: var(--accent);
            margin-left: 4px;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            -webkit-text-fill-color: var(--accent);
        }

        .result-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
            position: relative;
        }

        .detail-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.2), transparent);
        }

        .detail-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .detail-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 61, 113, 0.2);
            border: 1px solid rgba(255, 61, 113, 0.4);
            color: var(--danger);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px var(--danger-glow);
        }

        .toast.show {
            opacity: 1;
        }

        /* ===== 底部 ===== */
        .footer-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 24px;
            padding-bottom: 20px;
            font-family: var(--font-mono);
            letter-spacing: 0.8px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="toast" id="toast"></div>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="icon">📏</div>
            <h1>三维测距工具</h1>
            <p>基于经纬度 + 海拔的直线距离计算</p>
        </div>

        <!-- 格式选择器 -->
        <div class="format-selector" id="formatSelector">
            <button class="format-btn active" data-format="decimal">小数度</button>
            <button class="format-btn" data-format="dms">度分秒</button>
            <button class="format-btn" data-format="ddm">度·分</button>
        </div>

        <!-- 点 A -->
        <div class="point-card point-a">
            <div class="point-label">
                <span class="point-dot"></span> 点位 A
            </div>

            <!-- 小数度 -->
            <div class="format-inputs active" data-format="decimal" data-point="A">
                <div class="input-row">
                    <div class="input-group">
                        <label>纬度 <span class="unit">°</span></label>
                        <input type="number" class="lat-dec" placeholder="39.9042" step="any" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>经度 <span class="unit">°</span></label>
                        <input type="number" class="lon-dec" placeholder="116.4074" step="any" inputmode="decimal">
                    </div>
                </div>
            </div>

            <!-- 度分秒 -->
            <div class="format-inputs" data-format="dms" data-point="A">
                <div class="preview-row"><span class="preview-text lat-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lat-d" placeholder="39"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lat-m" placeholder="54"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">'</span>
                    <div class="input-group"><label>秒</label><input type="number" class="lat-s" placeholder="15.1"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">"</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lat-dir">
                            <option value="N">N</option>
                            <option value="S">S</option>
                        </select></div>
                </div>
                <div class="preview-row"><span class="preview-text lon-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lon-d" placeholder="116"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lon-m" placeholder="24"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">'</span>
                    <div class="input-group"><label>秒</label><input type="number" class="lon-s" placeholder="26.6"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">"</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lon-dir">
                            <option value="E">E</option>
                            <option value="W">W</option>
                        </select></div>
                </div>
            </div>

            <!-- 度·分 -->
            <div class="format-inputs" data-format="ddm" data-point="A">
                <div class="preview-row"><span class="preview-text lat-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lat-d" placeholder="39"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lat-m" placeholder="54.252"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">'</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lat-dir">
                            <option value="N">N</option>
                            <option value="S">S</option>
                        </select></div>
                </div>
                <div class="preview-row"><span class="preview-text lon-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lon-d" placeholder="116"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lon-m" placeholder="24.444"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">'</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lon-dir">
                            <option value="E">E</option>
                            <option value="W">W</option>
                        </select></div>
                </div>
            </div>

            <!-- 海拔 -->
            <div class="input-row">
                <div class="input-group">
                    <label>海拔高度 <span class="unit">(米)</span></label>
                    <input type="number" class="alt-input" placeholder="50" step="any" inputmode="decimal">
                </div>
                <div style="flex:1;visibility:hidden;"><label>&nbsp;</label><input disabled></div>
            </div>
        </div>

        <!-- 间距线 -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">↓</span>
            <span class="divider-line"></span>
        </div>

        <!-- 点 B -->
        <div class="point-card point-b">
            <div class="point-label">
                <span class="point-dot"></span> 点位 B
            </div>

            <!-- 小数度 -->
            <div class="format-inputs active" data-format="decimal" data-point="B">
                <div class="input-row">
                    <div class="input-group">
                        <label>纬度 <span class="unit">°</span></label>
                        <input type="number" class="lat-dec" placeholder="31.2304" step="any" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>经度 <span class="unit">°</span></label>
                        <input type="number" class="lon-dec" placeholder="121.4737" step="any" inputmode="decimal">
                    </div>
                </div>
            </div>

            <!-- 度分秒 -->
            <div class="format-inputs" data-format="dms" data-point="B">
                <div class="preview-row"><span class="preview-text lat-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lat-d" placeholder="31"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lat-m" placeholder="13"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">'</span>
                    <div class="input-group"><label>秒</label><input type="number" class="lat-s" placeholder="49.4"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">"</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lat-dir">
                            <option value="N">N</option>
                            <option value="S">S</option>
                        </select></div>
                </div>
                <div class="preview-row"><span class="preview-text lon-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lon-d" placeholder="121"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lon-m" placeholder="28"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">'</span>
                    <div class="input-group"><label>秒</label><input type="number" class="lon-s" placeholder="25.3"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">"</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lon-dir">
                            <option value="E">E</option>
                            <option value="W">W</option>
                        </select></div>
                </div>
            </div>

            <!-- 度·分 -->
            <div class="format-inputs" data-format="ddm" data-point="B">
                <div class="preview-row"><span class="preview-text lat-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lat-d" placeholder="31"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lat-m" placeholder="13.823"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">'</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lat-dir">
                            <option value="N">N</option>
                            <option value="S">S</option>
                        </select></div>
                </div>
                <div class="preview-row"><span class="preview-text lon-preview"></span></div>
                <div class="input-row">
                    <div class="input-group"><label>度</label><input type="number" class="lon-d" placeholder="121"
                            step="1" inputmode="numeric"></div>
                    <span class="dms-symbol">°</span>
                    <div class="input-group"><label>分</label><input type="number" class="lon-m" placeholder="28.422"
                            step="any" inputmode="decimal"></div>
                    <span class="dms-symbol">'</span>
                    <div class="dir-group"><label>&nbsp;</label><select class="lon-dir">
                            <option value="E">E</option>
                            <option value="W">W</option>
                        </select></div>
                </div>
            </div>

            <!-- 海拔 -->
            <div class="input-row">
                <div class="input-group">
                    <label>海拔高度 <span class="unit">(米)</span></label>
                    <input type="number" class="alt-input" placeholder="4" step="any" inputmode="decimal">
                </div>
                <div style="flex:1;visibility:hidden;"><label>&nbsp;</label><input disabled></div>
            </div>
        </div>

        <!-- 按钮 -->
        <div class="btn-row">
            <button class="btn btn-clear" onclick="clearAll()">✕ 清空</button>
            <button class="btn btn-calc" onclick="calculate()">📐 计算距离</button>
        </div>

        <!-- 结果 -->
        <div class="result" id="result">
            <div class="result-main">
                <span class="result-value" id="resultValue">--</span>
                <span class="result-unit" id="resultUnit">km</span>
            </div>
            <div class="result-detail">
                <div class="detail-item">
                    <div class="detail-value" id="groundDist">--</div>
                    <div class="detail-label">地面距离</div>
                </div>
                <div class="detail-item">
                    <div class="detail-value" id="altDiff">--</div>
                    <div class="detail-label">高差</div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            EARTH RADIUS 6371 km &nbsp;·&nbsp; HAVERSINE + 3D PYTHAGOREAN
        </div>
    </div>

    <script>
        // 注册 Service Worker（PWA 离线支持）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => { });
        }

        const EARTH_RADIUS_KM = 6371;
        let currentFormat = 'decimal';

        /* ====== 格式切换 ====== */

        document.getElementById('formatSelector').addEventListener('click', (e) => {
            const btn = e.target.closest('.format-btn');
            if (!btn) return;
            const fmt = btn.dataset.format;

            // 更新按钮激活状态
            document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFormat = fmt;

            // 更新所有点位卡片中的输入区域
            document.querySelectorAll('.format-inputs').forEach(el => {
                el.classList.toggle('active', el.dataset.format === fmt);
            });

            // 切换时不清空已填数据，方便对比
        });

        /* ====== 工具函数 ====== */

        function toRad(deg) { return deg * Math.PI / 180; }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return EARTH_RADIUS_KM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function fmt(num, dec) { return num.toFixed(dec); }

        function smartUnit(km) {
            if (km < 0.001) return { val: km * 1e6, unit: 'mm', decimals: 1 };
            if (km < 1) return { val: km * 1000, unit: 'm', decimals: 2 };
            return { val: km, unit: 'km', decimals: 3 };
        }

        /* ====== DMS / DDM → 小数度 ====== */

        function dmsToDecimal(d, m, s, dir) {
            let dec = (parseFloat(d) || 0) + (parseFloat(m) || 0) / 60 + (parseFloat(s) || 0) / 3600;
            if (dir === 'S' || dir === 'W') dec = -dec;
            return dec;
        }

        function ddmToDecimal(d, m, dir) {
            let dec = (parseFloat(d) || 0) + (parseFloat(m) || 0) / 60;
            if (dir === 'S' || dir === 'W') dec = -dec;
            return dec;
        }

        /* ====== 从点位卡片提取经纬度 ====== */

        function getPointCoords(point) {
            if (currentFormat === 'decimal') {
                const lat = parseFloat(point.querySelector('.lat-dec').value);
                const lon = parseFloat(point.querySelector('.lon-dec').value);
                return { lat, lon };
            }
            if (currentFormat === 'dms') {
                const latD = point.querySelector('.lat-d').value;
                const latM = point.querySelector('.lat-m').value;
                const latS = point.querySelector('.lat-s').value;
                const latDir = point.querySelector('.lat-dir').value;
                const lonD = point.querySelector('.lon-d').value;
                const lonM = point.querySelector('.lon-m').value;
                const lonS = point.querySelector('.lon-s').value;
                const lonDir = point.querySelector('.lon-dir').value;
                return {
                    lat: dmsToDecimal(latD, latM, latS, latDir),
                    lon: dmsToDecimal(lonD, lonM, lonS, lonDir),
                };
            }
            if (currentFormat === 'ddm') {
                const latD = point.querySelector('.lat-d').value;
                const latM = point.querySelector('.lat-m').value;
                const latDir = point.querySelector('.lat-dir').value;
                const lonD = point.querySelector('.lon-d').value;
                const lonM = point.querySelector('.lon-m').value;
                const lonDir = point.querySelector('.lon-dir').value;
                return {
                    lat: ddmToDecimal(latD, latM, latDir),
                    lon: ddmToDecimal(lonD, lonM, lonDir),
                };
            }
        }

        function getPointAlt(point) {
            return parseFloat(point.querySelector('.alt-input').value);
        }

        /* ====== 校验 ====== */

        function validateInputs() {
            const pa = document.querySelector('.point-a');
            const pb = document.querySelector('.point-b');
            const coordsA = getPointCoords(pa);
            const coordsB = getPointCoords(pb);
            const altA = getPointAlt(pa);
            const altB = getPointAlt(pb);

            const errors = [];
            const labelA = '点位 A', labelB = '点位 B';

            if (isNaN(coordsA.lat)) errors.push(labelA + '：请输入纬度');
            else if (coordsA.lat < -90 || coordsA.lat > 90) errors.push(labelA + '：纬度范围 -90° ~ 90°');
            if (isNaN(coordsA.lon)) errors.push(labelA + '：请输入经度');
            else if (coordsA.lon < -180 || coordsA.lon > 180) errors.push(labelA + '：经度范围 -180° ~ 180°');
            if (isNaN(altA)) errors.push(labelA + '：请输入海拔高度');

            if (isNaN(coordsB.lat)) errors.push(labelB + '：请输入纬度');
            else if (coordsB.lat < -90 || coordsB.lat > 90) errors.push(labelB + '：纬度范围 -90° ~ 90°');
            if (isNaN(coordsB.lon)) errors.push(labelB + '：请输入经度');
            else if (coordsB.lon < -180 || coordsB.lon > 180) errors.push(labelB + '：经度范围 -180° ~ 180°');
            if (isNaN(altB)) errors.push(labelB + '：请输入海拔高度');

            // DMS 额外校验
            if (currentFormat === 'dms') {
                const checkDms = (point, label) => {
                    const mLat = parseFloat(point.querySelector('.lat-m').value);
                    const sLat = parseFloat(point.querySelector('.lat-s').value);
                    const mLon = parseFloat(point.querySelector('.lon-m').value);
                    const sLon = parseFloat(point.querySelector('.lon-s').value);
                    if (!isNaN(mLat) && (mLat < 0 || mLat >= 60)) errors.push(label + '：纬度"分"应在 0~59');
                    if (!isNaN(sLat) && (sLat < 0 || sLat >= 60)) errors.push(label + '：纬度"秒"应在 0~59');
                    if (!isNaN(mLon) && (mLon < 0 || mLon >= 60)) errors.push(label + '：经度"分"应在 0~59');
                    if (!isNaN(sLon) && (sLon < 0 || sLon >= 60)) errors.push(label + '：经度"秒"应在 0~59');
                };
                checkDms(pa, labelA);
                checkDms(pb, labelB);
            }
            if (currentFormat === 'ddm') {
                const checkDdm = (point, label) => {
                    const mLat = parseFloat(point.querySelector('.lat-m').value);
                    const mLon = parseFloat(point.querySelector('.lon-m').value);
                    if (!isNaN(mLat) && (mLat < 0 || mLat >= 60)) errors.push(label + '：纬度"分"应在 0~59');
                    if (!isNaN(mLon) && (mLon < 0 || mLon >= 60)) errors.push(label + '：经度"分"应在 0~59');
                };
                checkDdm(pa, labelA);
                checkDdm(pb, labelB);
            }

            return { errors, coordsA, coordsB, altA, altB };
        }

        /* ====== 小数度 → DMS/DDM 显示预览 ====== */

        function decimalToDMS(dec, isLat) {
            const sign = dec < 0 ? -1 : 1;
            const abs = Math.abs(dec);
            const d = Math.floor(abs);
            const mFull = (abs - d) * 60;
            const m = Math.floor(mFull);
            const s = (mFull - m) * 60;
            const dir = isLat ? (sign < 0 ? 'S' : 'N') : (sign < 0 ? 'W' : 'E');
            return { d, m, s, dir };
        }

        function updatePreviews() {
            document.querySelectorAll('.point-card').forEach(card => {
                const coords = getPointCoords(card);
                // 更新 DMS 预览
                card.querySelectorAll('.format-inputs[data-format="dms"] .lat-preview').forEach(el => {
                    if (!isNaN(coords.lat)) {
                        const d = decimalToDMS(coords.lat, true);
                        el.textContent = `→ 小数：${fmt(coords.lat, 6)}°`;
                    } else el.textContent = '';
                });
                card.querySelectorAll('.format-inputs[data-format="dms"] .lon-preview').forEach(el => {
                    if (!isNaN(coords.lon)) {
                        const d = decimalToDMS(coords.lon, false);
                        el.textContent = `→ 小数：${fmt(coords.lon, 6)}°`;
                    } else el.textContent = '';
                });
                // 更新 DDM 预览
                card.querySelectorAll('.format-inputs[data-format="ddm"] .lat-preview').forEach(el => {
                    if (!isNaN(coords.lat))
                        el.textContent = `→ 小数：${fmt(coords.lat, 6)}°`;
                    else el.textContent = '';
                });
                card.querySelectorAll('.format-inputs[data-format="ddm"] .lon-preview').forEach(el => {
                    if (!isNaN(coords.lon))
                        el.textContent = `→ 小数：${fmt(coords.lon, 6)}°`;
                    else el.textContent = '';
                });
            });
        }

        // 监听所有输入变化，实时更新预览
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', updatePreviews);
        });
        document.querySelectorAll('select').forEach(sel => {
            sel.addEventListener('change', updatePreviews);
        });

        /* ====== 计算 ====== */

        function calculate() {
            const { errors, coordsA, coordsB, altA, altB } = validateInputs();
            if (errors.length > 0) { showToast(errors[0]); return; }

            const groundKm = haversineDistance(coordsA.lat, coordsA.lon, coordsB.lat, coordsB.lon);
            const altDiffKm = (altB - altA) / 1000;
            const straightKm = Math.sqrt(groundKm ** 2 + altDiffKm ** 2);

            const resultEl = document.getElementById('result');
            resultEl.classList.add('show');

            const su = smartUnit(straightKm);
            document.getElementById('resultValue').textContent = fmt(su.val, su.decimals);
            document.getElementById('resultUnit').textContent = su.unit;

            const gu = smartUnit(groundKm);
            document.getElementById('groundDist').textContent = fmt(gu.val, gu.decimals) + ' ' + gu.unit;

            const ad = Math.abs(altB - altA);
            document.getElementById('altDiff').textContent = ad >= 1000 ? fmt(ad / 1000, 2) + ' km' : fmt(ad, 1) + ' m';
        }

        /* ====== 清空 ====== */

        function clearAll() {
            document.querySelectorAll('.point-card input').forEach(input => { input.value = ''; });
            document.querySelectorAll('.point-card select').forEach(sel => { sel.selectedIndex = 0; });
            document.getElementById('result').classList.remove('show');
        }

        /* ====== 回车触发 ====== */

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); calculate(); }
            });
        });

    </script>
